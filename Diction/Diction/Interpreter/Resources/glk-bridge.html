<!doctype html><html><head><meta charset="utf-8">
<!-- Without this, iOS WKWebView lays the page out at 980px and scales it down,
     making all GlkOte text render tiny. Pin the layout to the device width. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Real GlkOte styles the windowport/gameport and the graphics canvas. -->
<link rel="stylesheet" href="glkote.css">
<style>
  /* glkote.css only sets #gameport{overflow:hidden} and makes #windowport 100%
     of it — its comment says "The host page is supposed to define the gameport's
     layout." We must size #gameport, or GlkOte measures a 0-height port and
     renders a sliver (the cream .WindowFrame stripe). Fill the WebView. */
  html, body { height: 100%; margin: 0; padding: 0; }
  /* The log is display-only — Diction owns input via the native bar. Make the
     content non-selectable so a tap has nothing to focus/select and the web view
     never grabs first-responder (which would dismiss the keyboard out from under
     the input field). Links stay tappable and double-tap-to-insert still resolves
     the word via caretRangeFromPoint, neither of which needs text selection. */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #gameport { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  /* Diction owns text input natively (the SwiftUI input bar), so suppress
     GlkOte's in-page <input> fields (classes Input/LineInput/CharInput,
     glkote.js:1516-1522) — they must never be the entry point here. */
  .Input, .LineInput, .CharInput { display: none !important; }
  /* The native input bar already shows the prompt + caret, so the game's dangling
     line-input prompt line ('>') in the log is a redundant second insertion point.
     Hide it only while the window is awaiting LINE input (GlkOte marks the frame
     .HasInputField and the field .LineInput, glkote.js:1503/1518); single-key
     prompts keep their .CharInput and stay visible. The line reappears as the
     '>command' echo the instant input ends (HasInputField drops), so command
     history is intact. `:not(:has(~ .BufferLine))` picks the last buffer line
     robustly — a trailing MorePrompt/PreviousMark sibling can't defeat it. */
  .WindowFrame.HasInputField:has(.LineInput) .BufferLine:not(:has(~ .BufferLine)) {
    display: none;
  }
  /* The status (grid) windows are rendered natively over the WebView by SwiftUI
     (StatusWindowView — fit-to-width, grows with the reading size). GlkOte still
     lays them out, but we minimise + hide them: a tiny font gives a huge column
     count so the game writes its FULL status line (never truncated; GridReflow
     compacts the padding), and a near-zero line box keeps the reserved band
     negligible. visibility:hidden hides GlkOte's own (mangled) grid while keeping
     its layout box and the content tap. */
  .GridWindow { font-size: 5px; line-height: 5px; padding: 0; visibility: hidden; }
</style>
</head>
<body>
<!-- GlkOte renders into #windowport and measures/lays out against #gameport;
     glkote_init hard-fails without #windowport (glkote.js:208-211) and reads
     #gameport for metrics (glkote.js:433). Both must exist before init. -->
<div id="gameport"><div id="windowport"></div></div>
<!-- Classic Glk stack as plain (non-module) scripts so their `var`/`window`
     globals attach to window, in dependency order. jQuery then glkote.js load
     before glkapi.js: real GlkOte aborts without jQuery (glkote.js:167), and
     glkapi resolves window.GlkOteClass at init. zvm_dispatch loads last so its
     window.GiDispa (the ZVM dispatch) wins for the Z-machine path. -->
<script src="jquery.min.js"></script>
<script src="glkote.js"></script>
<script src="glkapi.js"></script>
<script src="gi_blorb.js"></script>
<script src="gi_dispa.js"></script>
<script src="quixe.min.js"></script>
<script src="zvm.js"></script>
<script src="zvm_dispatch.js"></script>
<script src="glk-bridge.js"></script>
</body></html>
